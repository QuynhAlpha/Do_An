<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Tour - DAQT Travel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/dattour.css">

</head>
<body>

    <header>
        <div class="nav-container">
            <a href="trangchu.html" class="logo">DAQT Travel</a>
            <ul class="nav-links">
                <li><a href="trangchu.html">Trang Chủ</a></li>
                <li><a href="gioithieu.html">Giới Thiệu</a></li>
                <li><a href="dattour.html" class="active">Đặt Tour</a></li>
                <li><a href="lienhe.html">Liên Hệ</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <h1>Đăng Ký Đặt Tour</h1>
        <form onsubmit="event.preventDefault(); alert('Cảm ơn bạn đã đăng ký tour! DAQT Travel sẽ liên hệ lại với bạn sớm nhất.');">
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" placeholder="Nhập họ và tên của bạn..." required>
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="tel" placeholder="Nhập số điện thoại liên hệ..." required>
            </div>
            <div class="form-group">
                <label>Chọn tour muốn đi:</label>
                <select required>
                    <option value="">-- Lựa chọn tour --</option>
                    <option value="nghean">Nghệ An - Về Miền Quê Bác (1.800.000 VNĐ)</option>
                    <option value="dalat">Đà Lạt - Thành Phố Ngàn Hoa (2.900.000 VNĐ)</option>
                    <option value="danang">Đà Nẵng - Hội An (3.200.000 VNĐ)</option>
                    <option value="cuchi">TP.HCM - Địa đạo Củ Chi (1.200.000 VNĐ)</option>
                    <option value="hagiang">Hà Giang - Mùa Hoa Tam Giác Mạch (2.500.000 VNĐ)</option>
                    <option value="phuquoc">Phú Quốc - Đảo Ngọc Thiên Đường (4.500.000 VNĐ)</option>
                    <option value="sapa">Sapa - Đỉnh Fansipan Hùng Vĩ (2.653.000 VNĐ)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ghi chú thêm:</label>
                <textarea rows="4" placeholder="Yêu cầu đặc biệt (nếu có)..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Gửi Đăng Ký Tour</button>
        </form>
    </div>

    <div data-site-footer></div>

    <script src="js/footer-loader.js"></script>
</body>
</html>
