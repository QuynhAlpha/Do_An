<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Tour - LnQTravel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0d9488;
            text-decoration: none;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }
        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #0d9488;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 25px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #0d9488;
        }
        .submit-btn {
            background-color: #0d9488;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #0f766e;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #9ca3af;
            font-size: 14px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="trangchu.html" class="logo">LnQTravel</a>
            <ul class="nav-links">
                <li><a href="trangchu.html">Trang Chủ</a></li>
                <li><a href="gioithieu.html">Giới Thiệu</a></li>
                <li><a href="dattour.html" class="active">Đặt Tour</a></li>
                <li><a href="lienhe.html">Liên Hệ</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <h1>Đăng Ký Đặt Tour</h1>
        <form onsubmit="event.preventDefault(); alert('Cảm ơn bạn đã đăng ký tour! LnQTravel sẽ liên hệ lại với bạn sớm nhất.');">
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" placeholder="Nhập họ và tên của bạn..." required>
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="tel" placeholder="Nhập số điện thoại liên hệ..." required>
            </div>
            <div class="form-group">
                <label>Chọn tour muốn đi:</label>
                <select required>
                    <option value="">-- Lựa chọn tour --</option>
                    <option value="nghean">Nghệ An - Về Miền Quê Bác (1.800.000 VNĐ)</option>
                    <option value="dalat">Đà Lạt - Thành Phố Ngàn Hoa (2.900.000 VNĐ)</option>
                    <option value="danang">Đà Nẵng - Hội An (3.200.000 VNĐ)</option>
                    <option value="cuchi">TP.HCM - Địa đạo Củ Chi (1.200.000 VNĐ)</option>
                    <option value="hagiang">Hà Giang - Mùa Hoa Tam Giác Mạch (2.500.000 VNĐ)</option>
                    <option value="phuquoc">Phú Quốc - Đảo Ngọc Thiên Đường (4.500.000 VNĐ)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ghi chú thêm:</label>
                <textarea rows="4" placeholder="Yêu cầu đặc biệt (nếu có)..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Gửi Đăng Ký Tour</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Lập Trình Web - Lê Như Quỳnh. 255748020110172.</p>
    </footer>

</body>
</html>
